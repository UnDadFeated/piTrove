name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            libsdl3-dev \
            libsdl3-image-dev \
            libsdl3-ttf-dev \
            libavcodec-dev \
            libavformat-dev \
            libswscale-dev \
            libsqlite3-dev \
            libexif-dev \
            libheif-dev \
            libsodium-dev \
            nlohmann-json3-dev

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build

      - name: Configure ASan
        run: cmake -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"

      - name: Build ASan
        run: cmake --build build-asan

      - name: Configure TSan
        run: cmake -B build-tsan -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer"

      - name: Build TSan
        run: cmake --build build-tsan
