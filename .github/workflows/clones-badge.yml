name: Clones Badge

on:
  schedule:
    - cron: '0 6 * * 0'   # every Sunday 6 AM UTC
  workflow_dispatch:        # manual trigger

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch clone count from GitHub API
        id: clones
        env:
          TOKEN: ${{ secrets.REPO_TRAFFIC_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CLONES=$(curl -sf --retry 2 -H "Authorization: Bearer $TOKEN" "https://api.github.com/repos/${{ github.repository }}/traffic/clones" | jq '.count // 0')
          if [ -z "$CLONES" ] || [ "$CLONES" = "null" ]; then
            echo "Failed to read clone count; leaving badge unchanged"
            echo "count=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "count=$CLONES" >> "$GITHUB_OUTPUT"

      - name: Update badge JSON
        run: |
          mkdir -p .github
          # Nested double quotes inside echo "..." were stripped, writing {clones:42}
          # (invalid JSON). printf emits valid JSON.
          if [ "${{ steps.clones.outputs.count }}" != "skip" ]; then
            printf '{"clones":%s}\n' "${{ steps.clones.outputs.count }}" > .github/clones.json
          fi

      - name: Commit if changed
        run: |
          git config user.name "piTrove Bot"
          git config user.email "bot@pitrove.app"
          git add .github/clones.json
          if ! git diff --cached --quiet; then
            git commit -m "Update clones badge"
            git push
          else
            echo "No change — count is still ${{ steps.clones.outputs.count }}"
          fi
