name: Security

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  scan:
    permissions:
      contents: read
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build ARM64 image
        run: docker build --tag pitrove:security-scan .

      - name: Verify the production controller
        run: python3 src/tests/controller_server.py pitrove:security-scan

      - name: Scan runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: pitrove:security-scan
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          exit-code: '1'
          format: sarif
          output: trivy-image.sarif

      - name: Summarize runtime vulnerabilities
        if: always() && hashFiles('trivy-image.sarif') != ''
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import re

          with open("trivy-image.sarif", encoding="utf-8") as report:
              sarif = json.load(report)
          results = [result for run in sarif["runs"] for result in run.get("results", [])]
          advisories = sorted({result["ruleId"] for result in results
                               if re.fullmatch(r"CVE-\d{4}-\d{4,}", result.get("ruleId", ""))})
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"### ARM64 runtime scan\n\n{len(results)} high or critical findings.\n")
              for advisory in advisories:
                  summary.write(f"- [{advisory}](https://www.cve.org/CVERecord?id={advisory})\n")
          if advisories:
              print("::warning title=Runtime vulnerabilities::" + ", ".join(advisories[:20]))
          PYTHON

      - name: Scan repository
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          exit-code: '1'
          format: sarif
          output: trivy-repository.sarif

      - name: Upload scan reports
        if: always() && hashFiles('trivy-*.sarif') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-scan-sarif
          path: trivy-*.sarif
          retention-days: 14
