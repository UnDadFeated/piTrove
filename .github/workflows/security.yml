name: Security

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  scan:
    permissions:
      contents: read
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build ARM64 image
        run: docker build --tag pitrove:security-scan .

      - name: Verify the production controller
        run: python3 src/tests/controller_server.py pitrove:security-scan

      - name: Scan runtime image (fixable gate)
        env:
          TRIVY_VEX: .github/libxml2-backports.openvex.json
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: pitrove:security-scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          limit-severities-for-sarif: true
          exit-code: '1'
          format: sarif
          output: trivy-image.sarif

      - name: Scan runtime image (full report including unfixed)
        if: always()
        env:
          TRIVY_VEX: .github/libxml2-backports.openvex.json
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: pitrove:security-scan
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          limit-severities-for-sarif: true
          exit-code: '0'
          format: sarif
          output: trivy-image-full.sarif

      - name: Summarize runtime vulnerabilities
        if: always() && (hashFiles('trivy-image.sarif') != '' || hashFiles('trivy-image-full.sarif') != '')
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import re
          from pathlib import Path

          def load_report(path):
              if not Path(path).is_file():
                  return [], []
              with open(path, encoding="utf-8") as report:
                  sarif = json.load(report)
              results = [r for run in sarif.get("runs", []) for r in run.get("results", [])]
              advisories = sorted({
                  r["ruleId"] for r in results
                  if re.fullmatch(r"CVE-\d{4}-\d{4,}", r.get("ruleId", ""))
              })
              return results, advisories

          fix_results, fix_advisories = load_report("trivy-image.sarif")
          all_results, all_advisories = load_report("trivy-image-full.sarif")
          unfixed_advisories = sorted(set(all_advisories) - set(fix_advisories))

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("### ARM64 runtime scan\n\n")
              summary.write(f"- **Fixable HIGH/CRITICAL (gate):** {len(fix_results)} findings ({len(fix_advisories)} CVEs)\n")
              summary.write(f"- **Total HIGH/CRITICAL (including unfixed):** {len(all_results)} findings ({len(all_advisories)} CVEs)\n\n")
              if fix_advisories:
                  summary.write("#### Fixable advisories\n")
                  for advisory in fix_advisories:
                      summary.write(f"- [{advisory}](https://www.cve.org/CVERecord?id={advisory})\n")
              if unfixed_advisories:
                  summary.write("\n#### Unfixed upstream advisories (tracked)\n")
                  for advisory in unfixed_advisories:
                      summary.write(f"- [{advisory}](https://www.cve.org/CVERecord?id={advisory})\n")
          if fix_advisories:
              print("::warning title=Fixable runtime vulnerabilities::" + ", ".join(fix_advisories[:20]))
          if unfixed_advisories:
              print("::warning title=Unfixed runtime vulnerabilities::" + ", ".join(unfixed_advisories[:20]))
          PYTHON

      - name: Scan repository
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          exit-code: '1'
          format: sarif
          output: trivy-repository.sarif

      - name: Upload scan reports
        if: always() && hashFiles('trivy-*.sarif') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-scan-sarif
          path: trivy-*.sarif
          retention-days: 14
