name: Security

on:
  push:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  scan:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Build image
        run: docker build -t pitrove:scan .

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: pitrove:scan
          severity: HIGH,CRITICAL
          exit-code: 1
