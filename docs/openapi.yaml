openapi: 3.1.0
info:
  title: piTrove Control API
  version: 18.4.10
  description: |
    HTTP control surface exposed by the piTrove slideshow process.

    **Authentication is opt-in.** The server binds `INADDR_ANY` under
    `network_mode: host`. Routes marked "opt-in auth" are guarded by
    `is_authorized()`, which returns true unconditionally when `[remote] api_key`
    is empty in `config.toml`. With no key set the control API is fully open to
    the local network; with a key set, a `Authorization: Bearer <key>` header is
    required. The effective state is logged once at startup. Set an API key on
    any network you do not fully control.

    The controller accepts LAN IPv4 addresses, localhost, and .local names.
    Settings and chore edits use form-encoded POST requests. Legacy playback
    controls still accept GET for existing controllers.

servers:
  - url: http://localhost:9000

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        The value of `[remote] api_key`. Ignored (and not required) when that key
        is empty, in which case the protected routes are open.

  parameters:
    emptyAuth:
      name: emptyAuth
      in: query
      required: false
      schema:
        type: string
        enum: [""]
      description: >-
        Placeholder indicating the route is reachable without a credential when
        no API key is configured.

paths:
  /:
    get:
      summary: Web dashboard
      responses:
        "200":
          description: Dashboard HTML

  /dashboard:
    get:
      summary: Web dashboard
      responses:
        "200": { description: Dashboard HTML }

  /config:
    get:
      summary: Full settings editor
      responses:
        "200": { description: Configuration editor HTML }

  /chores:
    get:
      summary: Household chores board
      responses:
        "200": { description: Chores board HTML }

  /api/config:
    get:
      summary: Read settings schema, values and current revision
      security:
        - bearerAuth: []
      responses:
        "200": { description: Schema and settings JSON with secret values omitted }
        "401": { description: Unauthorized }
    post:
      summary: Save changes against the current revision
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [revision]
              properties:
                revision: { type: string }
              additionalProperties: { type: string }
      responses:
        "200": { description: Updated revision and settings }
        "400": { description: Invalid changes }
        "401": { description: Unauthorized }
        "409": { description: A concurrent update changed the revision }

  /api/chores:
    get:
      summary: List people, chores and the current household date
      security:
        - bearerAuth: []
      responses:
        "200": { description: Household chores JSON }
        "401": { description: Unauthorized }

  /api/chores/people/save:
    post:
      summary: Add or edit a person
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [name, color]
              properties:
                id: { type: string }
                name: { type: string }
                color: { type: string }
      responses: &choreMutation
        "200": { description: Chore store updated }
        "400": { description: Invalid fields }
        "401": { description: Unauthorized }
        "404": { description: Person or chore does not exist }
        "409": { description: Request conflicts with the current schedule or assignments }
        "415": { description: Unsupported body format }
        "503": { description: Chore store unavailable }

  /api/chores/people/delete:
    post:
      summary: Remove an unassigned person
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string }
      responses: *choreMutation

  /api/chores/tasks/save:
    post:
      summary: Add or edit a scheduled chore
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [person_id, title, repeat, all_day]
              properties:
                id: { type: string }
                person_id: { type: string }
                title: { type: string }
                repeat: { type: string }
                date: { type: string }
                time: { type: string }
                all_day: { type: string }
      responses: *choreMutation

  /api/chores/tasks/delete:
    post:
      summary: Remove a chore
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string }
      responses: *choreMutation

  /api/chores/tasks/complete:
    post:
      summary: Set completion for an occurrence
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [id, date, completed]
              properties:
                id: { type: string }
                date: { type: string }
                completed: { type: string }
      responses: *choreMutation

  /api/status:
    get:
      summary: Current playback status
      description: "Status is available for frame discovery. When an access key is configured, the filename and broker address require it."
      responses:
        "200":
          description: Status JSON
        "401": { description: Supplied controller key is invalid }
        "429": { description: Too many failed attempts from this client }

  /api/settings:
    get:
      summary: Read current settings
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Settings JSON with gcalendar_ical_url_set indicating whether a private feed is configured
        "401":
          description: Missing or invalid API key
        "429":
          description: Locked out after 5 failed attempts

  /api/settings/update:
    get:
      summary: Update settings (writes config.toml)
      description: >-
        Opt-in auth. Any query parameter name matching a config key is applied and the file is
        rewritten. String values are TOML-escaped on write.
      security:
        - bearerAuth: []
      parameters:
        - name: news_local_query
          in: query
          schema: { type: string }
          description: Local news ZIP/city query. Triggers a deferred news refetch.
        - name: news_blacklist
          in: query
          schema: { type: string }
          description: Comma-separated blacklist. Triggers a deferred news refetch.
      responses:
        "200": { description: OK }
        "400": { description: Clamp validation violation }
        "401": { description: Unauthorized }
        "429": { description: Locked out }

  /api/logs:
    get:
      summary: Recent log tail
      security:
        - bearerAuth: []
      responses:
        "200": { description: Log text }

  /api/next:
    get:
      summary: Skip to the next item
      security:
        - bearerAuth: []
      responses:
        "200": { description: OK }
        "401": { description: Unauthorized }
        "429": { description: Cooldown (500 ms) }

  /api/prev:
    get:
      summary: Skip to the previous item
      security:
        - bearerAuth: []
      responses:
        "200": { description: OK }
        "401": { description: Unauthorized }
        "429": { description: Cooldown (500 ms) }

  /api/pause:
    get:
      summary: Toggle pause
      security:
        - bearerAuth: []
      responses:
        "200": { description: OK }
        "401": { description: Unauthorized }

  /api/toggle_shuffle:
    get:
      summary: Toggle shuffle mode
      security:
        - bearerAuth: []
      responses:
        "200": { description: OK }
        "401": { description: Unauthorized }

  /api/restart:
    get:
      summary: Shut the process down (compose restarts it)
      security:
        - bearerAuth: []
      responses:
        "200": { description: OK }
        "401": { description: Unauthorized }

  /api/toggle_screen:
    get:
      summary: Blank or unblank the display
      security:
        - bearerAuth: []
      responses:
        "200": { description: OK }
        "401": { description: Unauthorized }

  /api/trigger_motion:
    get:
      summary: Wake the screen and publish a motion event
      security:
        - bearerAuth: []
      responses:
        "200": { description: OK }
        "401": { description: Unauthorized }

  /api/play_video:
    get:
      summary: Force the next playlist item to be a video
      security:
        - bearerAuth: []
      responses:
        "200": { description: OK }
        "401": { description: Unauthorized }

  /api/screenshot:
    get:
      summary: Capture the current framebuffer
      description: >-
        Opt-in auth. Blocks up to 5 s and forces a full framebuffer readback plus PNG encode on
        the render thread. Rate limited to one capture per 2 s.
      security:
        - bearerAuth: []
      responses:
        "200": { description: PNG image }
        "401": { description: Unauthorized }
        "429": { description: Rate limited }

  /api/preview:
    get:
      summary: Stream the currently displayed media file
      security:
        - bearerAuth: []
      responses:
        "200": { description: Media bytes }
        "401": { description: Missing or invalid controller key }

  /api/screenshots:
    get:
      summary: List stored screenshots
      security:
        - bearerAuth: []
      responses:
        "200": { description: Filename list }
        "401": { description: Missing or invalid controller key }

  /api/screenshots/{name}:
    get:
      summary: Fetch a stored screenshot
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
          description: URL-encoded PNG basename from the screenshot list.
      responses:
        "200": { description: PNG image }
        "400": { description: Invalid filename }
        "404": { description: Not found }
        "401": { description: Missing or invalid controller key }

  /api/news:
    get:
      summary: News ticker status
      security:
        - bearerAuth: []
      responses:
        "200": { description: News JSON }

  /api/news/refresh:
    post: &newsRefresh
      summary: Trigger a news refresh
      security:
        - bearerAuth: []
      responses:
        "200": { description: Refresh requested }
        "401": { description: Unauthorized }
    get: *newsRefresh

  /api/calendar:
    get:
      summary: Upcoming calendar events
      security:
        - bearerAuth: []
      responses:
        "200": { description: Calendar JSON }
        "401": { description: Missing or invalid controller key }

  /api/calendar/sync:
    get: &calendarRefresh
      summary: Trigger a calendar refresh now
      security:
        - bearerAuth: []
      responses:
        "200": { description: OK }
        "401": { description: Unauthorized }
    post: *calendarRefresh

  /api/stocks:
    get:
      summary: S&P 500 / crypto quotes
      security:
        - bearerAuth: []
      description: >-
        Quotes are fetched with TLS verification unless
        `[stockstreamer] tls_verify = 0`.
      responses:
        "200": { description: Quotes JSON }

  /google_photos_setup:
    get:
      summary: Google Photos Picker and account linking page
      responses:
        "200": { description: Controller page }
    post:
      summary: Start a state-bound OAuth link from localhost
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [client_id, client_secret]
              properties:
                client_id: { type: string }
                client_secret: { type: string }
      responses:
        "200": { description: Google authorization URL }
        "400": { description: Invalid inputs or a non-loopback host }
        "401": { description: Unauthorized }

  /api/google_photos/picker:
    get:
      summary: Get the state of the current Picker import
      security:
        - bearerAuth: []
      responses:
        "200": { description: Picker state, readiness, and import counts }
        "401": { description: Unauthorized }
    post:
      summary: Start a Picker session
      security:
        - bearerAuth: []
      responses:
        "200": { description: Picker state and link when ready }
        "401": { description: Unauthorized }

  /google_photos_callback:
    get:
      summary: Google OAuth redirect target
      description: >-
        Intentionally NOT authenticated. This is a Google-initiated redirect that cannot carry
        an `Authorization` header; gating it would break the OAuth flow. It only persists config
        after a successful token exchange.
      responses:
        "200": { description: Success or error page }
