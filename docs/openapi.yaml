openapi: 3.1.0
info:
  title: piTrove Control API
  version: 17.0.6

servers:
  - url: http://localhost:9000

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

paths:
  /api/next:
    post:
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Skip to next item

  /api/previous:
    post:
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Skip to previous item

  /api/screen/blank:
    post:
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Blank screen

  /api/screen/unblank:
    post:
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Unblank screen

  /metrics:
    get:
      responses:
        "200":
          description: Prometheus metrics
