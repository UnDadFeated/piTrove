services:
  pitrove:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: piTrove
    restart: always
    deploy:
      resources:
        limits:
          memory: 1024M
    stop_grace_period: 30s
    init: true
    network_mode: host
    cap_add:
      - SYS_ADMIN
      - SYS_RAWIO
      - SYS_NICE
    devices:
      - /dev/dri:/dev/dri
      - /dev/input:/dev/input
      - /dev/media0:/dev/media0
      - /dev/media1:/dev/media1
      - /dev/media2:/dev/media2
      - /dev/video19:/dev/video19
      - /dev/video20:/dev/video20
      - /dev/video21:/dev/video21
      - /dev/video22:/dev/video22
      - /dev/video23:/dev/video23
      - /dev/video24:/dev/video24
      - /dev/video25:/dev/video25
      - /dev/video26:/dev/video26
      - /dev/video27:/dev/video27
      - /dev/video28:/dev/video28
      - /dev/video29:/dev/video29
      - /dev/video30:/dev/video30
      - /dev/video31:/dev/video31
      - /dev/video32:/dev/video32
      - /dev/video33:/dev/video33
      - /dev/video34:/dev/video34
      - /dev/video35:/dev/video35
      - /dev/dma_heap:/dev/dma_heap
    security_opt:
      - no-new-privileges:true
    environment:
      - SDL_VIDEO_DRIVER=kmsdrm
      - SDL_VIDEO_KMSDRM_DEVICE=${SDL_VIDEO_KMSDRM_DEVICE:-/dev/dri/card1}
      - SDL_KMSDRM_DEVICE_INDEX=${SDL_KMSDRM_DEVICE_INDEX:-1}
      - XDG_CACHE_HOME=/app/cache
      - MESA_SHADER_CACHE_DIR=/app/cache/mesa_shader_cache
    healthcheck:
      test: ["CMD", "/app/scripts/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    volumes:
      - events:/app/events
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket
      - ./cache:/app/cache
      - ./config:/app/config
      - ./logs:/app/logs
      - ./subtitles:/app/subtitles
      - ${MEDIA_DIR:-/mnt/nas}:/app/media:ro

volumes:
  events:
