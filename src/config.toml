# ==========================================
# piTrove Configuration File (v10.1.0)
# ==========================================

[paths]
media_dir = /mnt/nas
cache_dir = /home/pi/piTrove/cache
log_dir = /home/pi/piTrove/logs

[display]
rotation = 0 # Deprecated/Ignored in Modesetting DRM pipeline
splash_file = src/splash.png
splash_overlay_y = 0.5
auto_display_rotation = 1 # Deprecated/Ignored in Modesetting DRM pipeline

[slideshow]
shuffle = 1
transition_delay = 120.0
transition_duration = 1.5
slideshow_fps = 30
transition_effect = "crossfade"
ken_burns = 0
ken_burns_speed = 0.1
matting = 1
matting_size = 96
cooldown_days = 330
reset_cooldown_on_restart = 0
preload_capacity = 4
preload_workers = 2
brightness_auto = 0
brightness_auto_min = 50
brightness_auto_max = 100
bias_lighting = 1
 bias_anim_speed = 0.5
 bias_anim_style = "edge_glow"
 bias_color_mode = "auto"
 ken_burns_zoom = 0.15
 bias_strength = 110
 edge_glow_shadow = 1
 
 [scan]
recursive = 1
depth = 10
max_concurrent = 4
window_days = 5
ignore_folders = ["@eaDir", "@Recycle", "Thumbs.db"]

[sqlite]
mmap_size = 67108864

[log]
level = info
log_keep_count = 5

[overlay]
font_path = "auto"
timer_enabled = 1
timer_x = 0.94
timer_y = 0.03
timer_font_size = 12
timer_color = yellow
filename_enabled = 1
filename_x = 0.04
filename_y = 0.966
count_enabled = 0
videos_per_photos = 10
play_just_photos = 0
play_just_videos = 0
show_people_faces = 1
keep_animals = 1
sleep_time = ""
wake_time = ""

[date_overlay]
enabled = 0
text = "%Y-%m-%d"
x = 0.1
y = 0.08
font_size = 20
color = cyan

[touch]
enabled = 0

[collage]
enabled = 0
cols = 2
rows = 2

[video]
volume = 0
probe_timeout = 5
closed_captions_enabled = 1
drm_connector = "auto"
drm_card = "auto"
video_audio_device = "auto"
osd_offset_x = -50
osd_offset_y = -80

[dashboard]
weather_enabled = 0
weather_lat = -999.0
weather_lon = -999.0

[remote]
http_enabled = 1
http_port = 9000
web_dashboard_enabled = 1

[features]
on_this_day_enabled = 0
diagnostics_hud_enabled = 0
adaptive_text_enabled = 1
twin_portrait_enabled = 1

[mqtt]
enabled = 0
broker = "192.168.4.111"
port = 1883
user = ""
pass = ""
topic_prefix = "piTrove"
motionsensor_topic = "home/motionsensor"
motionsensor_cooldown = 60

[google_photos]
enabled = 0
client_id = ""
client_secret = ""
refresh_token = ""
album_id = ""
sync_interval_mins = 60
cache_dir = "/app/cache/google_photos"


